name: Deploy

on:
  push:
    branches: [main]

# Requires repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with Workers + D1 permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
# The TMDB_API_KEY secret is set separately on the Worker: `wrangler secret put TMDB_API_KEY`.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # A single deploy: ships the Worker + the static frontend (Workers Static Assets).
      - name: Deploy Worker + Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
