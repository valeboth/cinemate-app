name: Deploy

on:
  push:
    branches: [main]

# Necesită secrete de repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token cu permisiuni Workers + D1
#   CLOUDFLARE_ACCOUNT_ID — ID-ul contului Cloudflare
# Secretul TMDB_API_KEY se pune separat pe Worker: `wrangler secret put TMDB_API_KEY`.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Un singur deploy: urcă Worker-ul + frontend-ul static (Workers Static Assets).
      - name: Deploy Worker + Assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
