name: Deploy

on:
  push:
    branches: [main]

# Necesită secrete de repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token cu permisiuni Workers + Pages + D1
#   CLOUDFLARE_ACCOUNT_ID — ID-ul contului Cloudflare
# Secretul TMDB_API_KEY se pune separat pe Worker: `wrangler secret put TMDB_API_KEY`.

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name cinemate --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
