# Cinemate — Cloudflare Workers configuration (IaC, versioned in the repo).
# No secrets here (the TMDb key goes through `wrangler secret put`).

name = "cinemate"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Disabled: we only use the custom domain cinemate.valegboth.win.
workers_dev = false

# --- Static frontend (Workers Static Assets) ---
# The Worker serves both the files in public/ and the /api routes on one origin.
# Assets take priority: GET / -> index.html, /app.js -> file; routes without a
# matching file (e.g. /api/*) reach the Worker. No CORS, a single deploy.
# Daily cleanup of old rooms/swipes/matches (see scheduled handler in src/index.ts).
[triggers]
crons = ["0 4 * * *"]

[assets]
directory = "./public"
# ASSETS binding: lets the Worker serve index.html for SPA paths like /join.
binding = "ASSETS"

# --- Custom domain ---
# Requires the valegboth.win zone to be in the same Cloudflare account.
# On deploy, wrangler provisions the DNS record + TLS certificate automatically.
[[routes]]
pattern = "cinemate.valegboth.win"
custom_domain = true

# --- D1 (relational database) ---
[[d1_databases]]
binding = "DB"
database_name = "cinemate-db"
database_id = "579c4bc5-31e2-4523-8f67-ceb6e2ea56c4"

# --- Workers KV (TMDb response cache) ---
[[kv_namespaces]]
binding = "TMDB_CACHE"
id = "c611f7ebdc324486ac99c396369c70a6"
preview_id = "c611f7ebdc324486ac99c396369c70a6"

# --- Durable Objects (live per-room state + WebSocket) ---
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# HARD REQUIREMENT: DO on the SQLite storage backend (free tier).
# => migrations with `new_sqlite_classes`, NOT `new_classes`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
