# Cinemate — configurare Cloudflare Workers
# IaC versionat în repo. ID-urile reale (D1, KV) le completezi TU după ce
# rulezi comenzile de creare (vezi README, secțiunea "Setup Cloudflare").
# NU pune aici secrete (cheia TMDb) — ea merge prin `wrangler secret put`.

name = "cinemate"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# nodejs_compat: activat pentru eventuale API-uri Node folosite de Hono/parsers.
compatibility_flags = ["nodejs_compat"]

# --- D1 (baza de date relațională) ---
[[d1_databases]]
binding = "DB"
database_name = "cinemate-db"
database_id = "579c4bc5-31e2-4523-8f67-ceb6e2ea56c4"

# --- Workers KV (cache răspunsuri TMDb) ---
# preview_id = același namespace ca prod: simplu, iar cache-ul TMDb e non-critic.
# Pentru separare dev/prod „ca la carte": npx wrangler kv:namespace create TMDB_CACHE --preview
# și pune id-ul de preview în preview_id.
[[kv_namespaces]]
binding = "TMDB_CACHE"
id = "c611f7ebdc324486ac99c396369c70a6"
preview_id = "c611f7ebdc324486ac99c396369c70a6"

# --- Durable Objects (stare live per cameră + WebSocket) ---
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# HARD REQUIREMENT: DO pe SQLite storage backend (free tier).
# => migrations cu `new_sqlite_classes`, NU `new_classes`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Notă: cheia TMDb (TMDB_API_KEY) NU e aici.
#   - local: în .dev.vars (gitignored)
#   - prod:  npx wrangler secret put TMDB_API_KEY
